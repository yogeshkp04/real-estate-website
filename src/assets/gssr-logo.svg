<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <style>
      .hexagon { fill: none; stroke: #d4af37; stroke-width: 3; }
      .building { fill: #d4af37; stroke: #d4af37; stroke-width: 0.5; }
      .text { fill: #d4af37; font-family: Arial, sans-serif; font-size: 48px; font-weight: bold; }
      .background { fill: #000000; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="200" class="background"/>
  
  <!-- Hexagon shape -->
  <path d="M 60 40 L 100 20 L 140 40 L 140 100 L 100 120 L 60 100 Z" class="hexagon"/>
  
  <!-- Building icon inside hexagon -->
  <g class="building" transform="translate(100, 70)">
    <!-- Main building shape -->
    <rect x="-20" y="-15" width="40" height="30" stroke="#d4af37" fill="none" stroke-width="1.5"/>
    <!-- Windows -->
    <rect x="-15" y="-10" width="5" height="5"/>
    <rect x="-5" y="-10" width="5" height="5"/>
    <rect x="5" y="-10" width="5" height="5"/>
    <rect x="-15" y="0" width="5" height="5"/>
    <rect x="-5" y="0" width="5" height="5"/>
    <rect x="5" y="0" width="5" height="5"/>
    <!-- Door -->
    <rect x="-3" y="8" width="6" height="7" stroke="#d4af37" fill="none" stroke-width="1"/>
  </g>
  
  <!-- Decorative lines -->
  <line x1="55" y1="65" x2="145" y2="65" stroke="#d4af37" stroke-width="1" opacity="0.3"/>
  
  <!-- GSSR Text -->
  <text x="200" y="110" class="text">GSSR</text>
</svg>