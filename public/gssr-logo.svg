<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .hexagon { fill: none; stroke: #d4af37; stroke-width: 4; stroke-linejoin: round; }
      .building-outline { fill: none; stroke: #d4af37; stroke-width: 2; }
      .building-fill { fill: #d4af37; }
      .text { fill: #d4af37; font-family: Arial, sans-serif; font-size: 56px; font-weight: 900; letter-spacing: 2px; }
      .background { fill: #000000; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="200" class="background"/>
  
  <!-- Hexagon shape (left side) -->
  <path d="M 50 35 L 85 15 L 120 35 L 120 105 L 85 125 L 50 105 Z" class="hexagon"/>
  
  <!-- Building icon inside hexagon (simplified) -->
  <g transform="translate(85, 70)">
    <!-- Main building -->
    <rect x="-18" y="-18" width="36" height="36" class="building-outline"/>
    <!-- Windows row 1 -->
    <rect x="-14" y="-12" width="6" height="6" class="building-fill"/>
    <rect x="-4" y="-12" width="6" height="6" class="building-fill"/>
    <rect x="6" y="-12" width="6" height="6" class="building-fill"/>
    <!-- Windows row 2 -->
    <rect x="-14" y="0" width="6" height="6" class="building-fill"/>
    <rect x="-4" y="0" width="6" height="6" class="building-fill"/>
    <rect x="6" y="0" width="6" height="6" class="building-fill"/>
    <!-- Door -->
    <rect x="-4" y="10" width="8" height="8" class="building-outline"/>
  </g>
  
  <!-- GSSR Text (right side) -->
  <text x="200" y="130" class="text">GSSR</text>
</svg>