<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <style>
      .logo-bg { fill: #1e40af; }
      .logo-text { fill: #ffffff; font-family: 'Libre Baskerville', serif; font-size: 72px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .logo-accent { fill: none; stroke: #f59e0b; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" class="logo-bg"/>
  
  <!-- Accent circle outline -->
  <circle cx="128" cy="128" r="115" class="logo-accent"/>
  
  <!-- Text: GSS -->
  <text x="128" y="128" class="logo-text">G</text>
  <text x="128" y="135" class="logo-text" font-size="48">SR</text>
</svg>